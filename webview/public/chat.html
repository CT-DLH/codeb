<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeb 对话</title>
<link rel="stylesheet" href="/chat.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════
     外壳布局（照 DSH 的 AppFrame）：
       ┌────────────┬────────────────────────────────────┐
       │ 侧栏        │ 顶栏（标题 + 页签 + 状态）            │
       │ 品牌        ├────────────────────────────────────┤
       │ 新会话       │ 消息滚动区                          │
       │ 会话列表     │                                    │
       │             ├────────────────────────────────────┤
       │             │ 输入框（composer）                  │
       │ 底部状态     │                                    │
       └────────────┴────────────────────────────────────┘
     ══════════════════════════════════════════════════════════════ -->

<div class="app">

  <!-- ─────────────── 侧栏 ─────────────── -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">codeb</span>
      <span class="brand-sub">对话</span>
    </div>

    <button class="new-chat" id="newChatBtn">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round"/>
      </svg>
      新会话
    </button>

    <nav class="session-list" id="sessionList">
      <div class="session-empty">还没有会话</div>
    </nav>

    <div class="sidebar-foot">
      <a class="foot-btn" href="/" id="panelLink" title="回到项目面板">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
        </svg>
        项目面板
      </a>
    </div>
  </aside>

  <!-- ─────────────── 主区 ─────────────── -->
  <main class="main">

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="topbar-title" id="topTitle">codeb 对话</div>
      <div class="topbar-tabs" id="topTabs">
        <button class="tab active" data-tab="chat">对话</button>
        <button class="tab" data-tab="context">上下文</button>
        <button class="tab" data-tab="trajectory">轨迹</button>
      </div>
      <div class="topbar-right">
        <!-- 工作目录（决定注入哪个仓库的目录树）-->
        <button class="picker-btn" id="repoBtn" title="切换工作目录（重新装订目录树）">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <path d="M1.8 4.2h4.3l1.2 1.5h7v7.1H1.8z" stroke="currentColor"
                  stroke-width="1.3" fill="none" stroke-linejoin="round"/>
          </svg>
          <span id="repoBtnLabel">codeb</span>
        </button>
        <!-- 模型选择 -->
        <button class="picker-btn" id="modelBtn" title="切换模型">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.3" fill="none"/>
            <path d="M8 4.6v3.6l2.4 1.6" stroke="currentColor" stroke-width="1.3"
                  fill="none" stroke-linecap="round"/>
          </svg>
          <span id="modelBtnLabel">—</span>
        </button>
        <!-- 思考链开关：开启后模型输出 reasoning，在消息里以可折叠的「思考」行展示 -->
        <button class="cot-toggle" id="cotToggle" title="开关思考链（reasoning）展示"
                aria-pressed="false">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <path d="M8 2.2a4.2 4.2 0 0 0-2.4 7.6c.5.4.8.9.9 1.5h3c.1-.6.4-1.1.9-1.5A4.2 4.2 0 0 0 8 2.2z"
                  stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
            <path d="M6.4 13.2h3.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          思考
        </button>
        <span class="ctx-chip" id="ctxChip" title="当前上下文占用的绝对 token 数">— tok</span>
      </div>
    </header>

    <!-- 对话页签 -->
    <section class="pane active" id="paneChat">
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">◈</div>
          <h2>codeb 对话</h2>
          <p>目录树已预装进上下文，模型先看项目结构再决定读什么。</p>
          <ul class="welcome-tips">
            <li>问「这个项目的路由 LLM 链路是什么样」</li>
            <li>问「<code>kb.py</code> 里 <code>cmd_route</code> 怎么降档」</li>
            <li>问「有几处调用了 <code>est_tokens</code>」——会走 <code>grep_count</code></li>
          </ul>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"
                    spellcheck="false"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <button class="icon-btn" id="attachBtn" title="重新配置上下文" disabled>
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"
                          fill="none"/>
                  <path d="M8 5.5v5M5.5 8h5" stroke="currentColor" stroke-width="1.4"
                        stroke-linecap="round"/>
                </svg>
              </button>
              <span class="composer-hint" id="composerHint">就绪</span>
            </div>
            <button class="send-btn" id="sendBtn" title="发送">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" id="sendIcon">
                <path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" stroke="currentColor"
                      stroke-width="1.7" fill="none" stroke-linecap="round"
                      stroke-linejoin="round"/>
              </svg>
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" id="stopIcon"
                   style="display:none">
                <rect x="4" y="4" width="8" height="8" rx="1.4" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="composer-foot" id="composerFoot"></div>
      </div>
    </section>

    <!-- 上下文页签 -->
    <section class="pane" id="paneContext">
      <div class="pane-inner">
        <h2 class="pane-title">
          上下文构成
          <span class="pane-hint">下一轮真正要发给模型的内容</span>
        </h2>
        <div class="ctx-modes" id="ctxModes">
          <button class="ctx-mode active" data-mode="aggregated">聚合态
            <span class="mode-hint">按语义分段、token 降序，带折叠说明</span></button>
          <button class="ctx-mode" data-mode="raw">原始态
            <span class="mode-hint">真实发给 LLM 的 messages，按原顺序</span></button>
        </div>
        <div class="ctx-summary" id="ctxSummary"></div>
        <div class="ctx-sections" id="ctxSections"></div>
        <div class="ctx-actions">
          <button class="ghost-btn" id="reloadCtxBtn">重新读取</button>
        </div>
      </div>
    </section>

    <!-- 轨迹页签 -->
    <section class="pane" id="paneTrajectory">
      <div class="pane-inner">
        <h2 class="pane-title">工具调用轨迹 <span class="pane-hint">这一轮模型调了什么、拿到什么</span></h2>
        <div class="traj-list" id="trajList">
          <div class="traj-empty">还没有工具调用</div>
        </div>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>

<!-- 通用下拉菜单（模型 / 工作目录共用）-->
<div class="dropdown" id="dropdown" style="display:none">
  <div class="dropdown-head">
    <input type="search" class="dropdown-search" id="dropdownSearch" placeholder="搜索…">
  </div>
  <div class="dropdown-list" id="dropdownList"></div>
  <div class="dropdown-foot" id="dropdownFoot"></div>
</div>

<script src="/chat.js"></script>
</body>
</html>
