<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeb · 项目</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="home">
<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>codeb</h1>
  </div>
  <div class="header-actions">
    <span class="source-badges" id="hint"></span>
    <button id="refreshBtn" title="重新拉取项目列表">刷新</button>
  </div>
</header>

<main>
  <section class="home-hero">
    <h2>选择项目</h2>
    <p class="home-sub">每个项目是一个独立的知识库分区，进入后只看该项目的内容。</p>
  </section>

  <section class="project-grid" id="projectGrid">
    <div class="loading">加载中…</div>
  </section>

  <!-- 导入：路径 + 可选名称，提交后后台扫描 -->
  <section class="card import-card">
    <h2>导入项目 <span class="hint">填仓库源码目录；知识页骨架会自动创建</span></h2>
    <div class="import-row">
      <input id="importPath" class="import-input" type="text" spellcheck="false"
             placeholder="例如 D:\work\project\viscode" list="siblingHints">
      <datalist id="siblingHints"></datalist>
      <input id="importName" class="import-name" type="text" spellcheck="false"
             placeholder="项目名（可选，默认取目录名）">
      <button id="importBtn" class="primary">导入</button>
    </div>
    <div class="import-msg" id="importMsg"></div>
    <div class="import-tip">
      导入后会自动执行 <code>projtree scan</code> 与 <code>kb reindex</code>，
      大项目需要几秒钟。扫描期间卡片会显示进度。
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="/home.js"></script>
</body>
</html>
